<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameVault Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
    :root{--bg:#0a0a0f;--bg2:#12121a;--card:#1a1a2e;--input:#16162a;--text:#fff;--text2:#a0a0b8;--purple:#7c3aed;--cyan:#22d3ee;--green:#10b981;--red:#ef4444;--gold:#f59e0b;--border:#2a2a3e;--radius:12px;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    .login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,rgba(124,58,237,0.1),rgba(34,211,238,0.05));}
    .login-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:40px;width:100%;max-width:400px;}
    .login-box h1{text-align:center;font-size:24px;margin-bottom:8px;}
    .login-box h1 i{color:var(--purple);}
    .login-box p{text-align:center;color:var(--text2);font-size:13px;margin-bottom:24px;}
    .input-group{margin-bottom:16px;}
    .input-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text2);}
    .input-group input{width:100%;padding:12px 16px;background:var(--input);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;}
    .input-group input:focus{outline:none;border-color:var(--purple);}
    .btn{padding:12px 24px;border-radius:var(--radius);font-size:15px;font-weight:600;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all 0.3s;width:100%;justify-content:center;}
    .btn-primary{background:linear-gradient(135deg,var(--purple),var(--cyan));color:#fff;}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(124,58,237,0.4);}
    .btn-danger{background:var(--red);color:#fff;}
    .btn-outline{background:transparent;color:var(--text);border:1px solid var(--border);}
    .btn-sm{padding:6px 12px;font-size:12px;width:auto;justify-content:center;}
    .error-msg{color:var(--red);font-size:13px;text-align:center;margin-top:12px;display:none;}
    .panel{display:none;padding:20px;max-width:1400px;margin:0 auto;}
    .panel.active{display:block;}
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
    .header h1{font-size:24px;}
    .header h1 i{color:var(--purple);}
    .admin-badge{background:linear-gradient(135deg,var(--purple),var(--cyan));padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;}
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px;}
    .stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
    .stat-card .label{font-size:13px;color:var(--text2);}
    .stat-card .value{font-size:28px;font-weight:800;margin-top:4px;}
    .search-bar{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:24px;}
    .search-bar input{width:100%;padding:12px 16px;background:var(--input);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;}
    .users-table{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
    .table-wrap{overflow-x:auto;}
    table{width:100%;border-collapse:collapse;}
    th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--border);font-size:13px;}
    th{color:var(--text2);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:1px;background:var(--bg2);}
    tr:hover{background:rgba(124,58,237,0.05);}
    .badge{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;}
    .badge-banned{background:rgba(239,68,68,0.15);color:var(--red);}
    .badge-active{background:rgba(16,185,129,0.15);color:var(--green);}
    .badge-admin{background:rgba(245,158,11,0.15);color:var(--gold);}
    .badge-pending{background:rgba(163,163,163,0.15);color:var(--text2);}
    .edit-input{background:var(--input);border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--text);font-size:12px;width:100%;min-width:80px;}
    .edit-input:focus{outline:none;border-color:var(--purple);}
    .actions{display:flex;gap:4px;}
    .toast-box{position:fixed;top:20px;right:20px;z-index:999;}
    .toast{padding:14px 20px;border-radius:var(--radius);font-size:14px;font-weight:500;color:#fff;box-shadow:0 8px 32px rgba(0,0,0,0.4);animation:si 0.3s;}
    .toast-success{background:var(--green);}.toast-error{background:var(--red);}.toast-info{background:var(--purple);}
    @keyframes si{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
    </style>
</head>
<body>
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h1><i class="fas fa-user-shield"></i> Admin</h1>
            <p>Acesso restrito</p>
            <div class="input-group"><label>Email</label><input type="email" id="adminEmail" placeholder="admin@email.com"></div>
            <div class="input-group"><label>Senha</label><input type="password" id="adminPass" placeholder="••••"></div>
            <button class="btn btn-primary" onclick="doLogin()"><i class="fas fa-sign-in-alt"></i> Entrar</button>
            <div class="error-msg" id="errorMsg"></div>
        </div>
    </div>
    <div class="panel" id="panel">
        <div class="header">
            <h1><i class="fas fa-crown"></i> Painel Admin</h1>
            <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
                <span class="admin-badge" id="adminInfo"></span>
                <a href="/" class="btn btn-outline btn-sm" style="text-decoration:none;"><i class="fas fa-home"></i> Site</a>
                <button class="btn btn-danger btn-sm" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i> Sair</button>
            </div>
        </div>
        <div class="stats-grid" id="statsGrid"></div>
        <div class="search-bar"><input type="text" id="searchInput" placeholder="🔍 Buscar email ou nome..." oninput="filterUsers()"></div>
        <div class="wallet-card" style="margin-bottom:24px;">
            <h3><i class="fas fa-money-bill-wave" style="color:var(--accent-green);"></i> Saques Pendentes</h3>
            <div id="withdrawalsList"></div>
        </div>
        <div class="wallet-card" style="margin-bottom:24px;">
            <h3><i class="fas fa-qrcode" style="color:var(--accent-cyan);"></i> Depósitos Pendentes</h3>
            <div id="depositsList"></div>
        </div>
        <div class="wallet-card" style="margin-bottom:24px;">
            <h3><i class="fas fa-list-check" style="color:var(--accent-gold);"></i> Tarefas Pendentes</h3>
            <div id="tasksList"></div>
        </div>

        <div class="users-table"><div class="table-wrap"><table><thead><tr><th>Nome</th><th>Email</th><th>Saldo</th><th>Depósito</th><th>Ganho</th><th>Saque</th><th>Status</th><th>Ações</th></tr></thead><tbody id="usersBody"></tbody></table></div></div>
    </div>
    <div class="toast-box" id="toastBox"></div>
    <script>
    const ADMIN_EMAILS=['Nicolas21301012@gmail.com','dohypemeno5@gmail.com'];
    const API_URL='https://ala-defence-reel-flexible.trycloudflare.com';
    let currentAdmin=null;
    let adminData=null;

    async function adminApi(path,options={}){
        const response=await fetch(API_URL+path,{...options,headers:{'Content-Type':'application/json','X-Admin-Token':localStorage.getItem('gv_admin_api_token')||'',...(options.headers||{})}});
        const data=await response.json().catch(()=>({}));
        if(!response.ok)throw new Error(data.error||('HTTP '+response.status));
        return data;
    }

    function getUsers(){try{return JSON.parse(localStorage.getItem('gv_users'))||[];}catch{return[];}}
    function setUsers(u){localStorage.setItem('gv_users',JSON.stringify(u));}
    function getBanned(){try{return JSON.parse(localStorage.getItem('gv_banned'))||[];}catch{return[];}}
    function setBanned(b){localStorage.setItem('gv_banned',JSON.stringify(b));}

    async function doLogin(){
        const email=document.getElementById('adminEmail').value.trim();
        const pass=document.getElementById('adminPass').value;
        try{
            const result=await fetch(API_URL+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})}).then(r=>r.json());
            if(!result.success)throw new Error(result.error||'Credenciais inválidas');
            localStorage.setItem('gv_admin_api_token',result.token);
            currentAdmin=result.admin;showPanel();loadPanel();
        }catch(error){
            const el=document.getElementById('errorMsg');el.style.display='block';el.textContent='Credenciais inválidas';
        }
    }

    function showPanel(){
        localStorage.setItem('gv_admin_logged','1');
        document.getElementById('loginScreen').style.display='none';
        document.getElementById('panel').classList.add('active');
        document.getElementById('adminInfo').innerHTML='👑 '+(currentAdmin?.email||'Admin');
    }

    function doLogout(){
        currentAdmin=null;
        localStorage.removeItem('gv_admin_api_token');
        localStorage.removeItem('gv_admin_logged');
        document.getElementById('panel').classList.remove('active');
        document.getElementById('loginScreen').style.display='flex';
        document.getElementById('adminEmail').value='';
        document.getElementById('adminPass').value='';
    }

    async function loadPanel(){
        try{
            adminData=await adminApi('/api/admin/overview');
        }catch(error){
            adminData=null;
        }
        renderPanel();
    }

    function renderPanel(){
        const users=adminData?adminData.users:getUsers();
        const banned=getBanned();
        const totalDep=users.reduce((s,u)=>s+(u.deposit||0),0);
        const totalWit=users.reduce((s,u)=>s+(u.withdrawn||0),0);
        const totalWon=users.reduce((s,u)=>s+(u.won||0),0);

        document.getElementById('statsGrid').innerHTML=`
            <div class="stat-card"><div class="label">Usuários</div><div class="value">${users.length}</div></div>
            <div class="stat-card"><div class="label">Depositado</div><div class="value" style="color:var(--green);">R$ ${totalDep.toFixed(2).replace('.',',')}</div></div>
            <div class="stat-card"><div class="label">Sacado</div><div class="value" style="color:var(--red);">R$ ${totalWit.toFixed(2).replace('.',',')}</div></div>
            <div class="stat-card"><div class="label">Lucro</div><div class="value" style="color:var(--gold);">R$ ${(totalDep-totalWit-totalWon).toFixed(2).replace('.',',')}</div></div>
            <div class="stat-card"><div class="label">Banidos</div><div class="value" style="color:var(--red);">${adminData?users.filter(u=>u.banned).length:banned.length}</div></div>
            <div class="stat-card"><div class="label">Jogos</div><div class="value">${users.reduce((s,u)=>s+(u.played||0),0)}</div></div>
            ${adminData?`<div class="stat-card"><div class="label">Saques pendentes</div><div class="value">${adminData.stats.pendingWithdrawals}</div></div><div class="stat-card"><div class="label">Tarefas pendentes</div><div class="value">${adminData.stats.pendingTasks}</div></div>`:''}`;

        const tbody=document.getElementById('usersBody');
        if(users.length===0)tbody.innerHTML='<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--text2);">Nenhum usuário registrado</td></tr>';

        tbody.innerHTML=users.map(u=>{
            const isBanned=banned.includes(u.email);
            const isAdm=ADMIN_EMAILS.includes(u.email);
            return `<tr class="user-row" data-email="${u.email}" data-name="${(u.name||'').toLowerCase()}">
                <td><input class="edit-input" value="${u.name||''}" onchange="editUser('${u.email}','name',this.value)"></td>
                <td style="font-size:11px;word-break:break-all;">${u.email}${isAdm?'<br><span class="badge badge-admin">👑 Owner</span>':''}</td>
                <td><input class="edit-input" type="number" value="${u.balance||0}" onchange="editUser('${u.email}','balance',this.value)"></td>
                <td style="color:var(--green);font-size:12px;">R$ ${(u.deposit||0).toFixed(2).replace('.',',')}</td>
                <td style="font-size:12px;">R$ ${(u.won||0).toFixed(2).replace('.',',')}</td>
                <td style="color:var(--red);font-size:12px;">R$ ${(u.withdrawn||0).toFixed(2).replace('.',',')}</td>
                <td>${(adminData?u.banned:isBanned)?'<span class="badge badge-banned">🚫 Banido</span>':u.kyc==='approved'?'<span class="badge badge-active">✓ Verificado</span>':'<span class="badge badge-pending">⏳</span>'}</td>
                <td><div class="actions">
                    ${isBanned?`<button class="btn btn-outline btn-sm" onclick="unbanUser('${u.email}')"><i class="fas fa-check"></i></button>`:`<button class="btn btn-danger btn-sm" onclick="banUser('${u.email}')"><i class="fas fa-ban"></i></button>`}
                    <button class="btn btn-danger btn-sm" onclick="deleteUser('${u.email}')"><i class="fas fa-trash"></i></button>
                </div></td></tr>`;
        }).join('');
        if(adminData)renderQueues();
    }

    function editUser(email,field,value){
        const users=getUsers();
        const u=users.find(x=>x.email===email);
        if(!u)return;
        if(field==='name')u.name=value;
        if(field==='balance')u.balance=parseFloat(value)||0;
        setUsers(users);toast('Editado!','success');loadPanel();
    }

    function banUser(email){
        if(!confirm('Banir '+email+'?'))return;
        const b=getBanned();if(!b.includes(email))b.push(email);setBanned(b);
        toast(email+' banido!','success');loadPanel();
    }

    function unbanUser(email){
        const b=getBanned().filter(e=>e!==email);setBanned(b);
        toast(email+' desbanido!','success');loadPanel();
    }

    function deleteUser(email){
        if(!confirm('DELETAR '+email+'? PERMANENTE!'))return;
        let users=getUsers();users=users.filter(u=>u.email!==email);setUsers(users);
        const b=getBanned().filter(e=>e!==email);setBanned(b);
        toast(email+' deletado!','success');loadPanel();
    }

    function filterUsers(){
        const q=(document.getElementById('searchInput').value||'').toLowerCase();
        document.querySelectorAll('.user-row').forEach(r=>{
            const email=(r.dataset.email||'').toLowerCase();const name=(r.dataset.name||'').toLowerCase();
            r.style.display=(!q||email.includes(q)||name.includes(q))?'':'none';
        });
    }

    function toast(msg,type='info'){
        const c=document.getElementById('toastBox');const t=document.createElement('div');
        t.className='toast toast-'+type;t.textContent=msg;c.appendChild(t);setTimeout(()=>t.remove(),4000);
    }

    document.getElementById('adminPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

    // Auto-login check
    if(localStorage.getItem('gv_admin_api_token')){currentAdmin={email:'Admin'};showPanel();loadPanel();}
    function money(cents){return 'R$ '+(cents/100).toFixed(2).replace('.',',');}

    function queueCard(item,title,subtitle,resource){
        const statusText=item.status==='PENDING'?'⏳ Pendente':(item.status==='APPROVED'||item.status==='PAID')?'✅ Aprovado':'❌ Rejeitado';
        const color=item.status==='PENDING'?'var(--gold)':(item.status==='APPROVED'||item.status==='PAID')?'var(--green)':'var(--red)';
        const buttons=item.status==='PENDING'?`<div style="margin-top:12px;display:flex;gap:8px;"><button class="btn btn-success btn-sm" onclick="adminAction('${resource}','${item.id||item.txid}','approve')">Aprovar</button><button class="btn btn-danger btn-sm" onclick="adminAction('${resource}','${item.id||item.txid}','reject')">Rejeitar</button></div>`:'';
        const amountCents=item.amount_cents||0;
        return `<div style="background:var(--input);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px;"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;"><div><strong>${title}</strong><br><span style="font-size:12px;color:var(--text2);">${subtitle}</span></div><div style="text-align:right;"><div style="font-size:20px;font-weight:800;">${money(amountCents)}</div><span style="color:${color}">${statusText}</span></div></div>${buttons}</div>`;
    }

    function renderQueues(){
        document.getElementById('withdrawalsList').innerHTML=adminData.withdrawals.length?adminData.withdrawals.map(item=>queueCard(item,item.full_name,`${item.email} | CPF: ${item.cpf} | Pix: ${item.pix_key}`,'withdrawals')).join(''):'<p style="color:var(--text2);">Nenhum saque</p>';
        document.getElementById('depositsList').innerHTML=adminData.deposits.length?adminData.deposits.map(item=>queueCard(item,item.txid,item.email,'deposits')).join(''):'<p style="color:var(--text2);">Nenhum depósito</p>';
        document.getElementById('tasksList').innerHTML=adminData.taskClaims.length?adminData.taskClaims.map(item=>queueCard(item,item.title,`${item.email} | ${item.id}`,'task-claims')).join(''):'<p style="color:var(--text2);">Nenhuma tarefa</p>';
    }

    async function adminAction(resource,id,action){
        if(action==='reject'&&!confirm('Rejeitar solicitação?'))return;
        try{await adminApi('/api/admin/'+resource+'/'+id+'/'+action,{method:'POST'});toast('Solicitação atualizada!','success');loadPanel();}catch(error){toast(error.message,'error');}
    }


    </script>
</body>
</html>
